---
- name: Configurar servidor web
  hosts: web
  become: true
  tasks:
    - name: Instalar nginx en versión fija
      ansible.builtin.apt:
        name: nginx=1.24.*
        state: present
        update_cache: true

    - name: Copiar configuración de nginx
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"

    - name: Descargar script validando el certificado
      ansible.builtin.get_url:
        url: https://example.com/agent.sh
        dest: /tmp/agent.sh
        mode: "0750"
        validate_certs: true
